name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install package and development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Verify license copies match
        run: python -c "from pathlib import Path; assert Path('LICENSE').read_bytes() == Path('../LICENSE').read_bytes()"

      - name: Lint
        run: python -m ruff check --no-cache src tests

      - name: Check formatting
        run: python -m ruff format --check src tests

      - name: Type check
        run: python -m mypy src

      - name: Test
        run: python -m pytest -q

      - name: Build wheel
        run: python -m pip wheel --no-deps --wheel-dir dist .

      - name: Verify wheel contains license and type marker
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheel = next(Path("dist").glob("*.whl"))
          names = ZipFile(wheel).namelist()
          assert "werewolf_dm/py.typed" in names, names
          assert any(name.endswith(".dist-info/licenses/LICENSE") for name in names), names
          PY

      - name: Upload wheel
        uses: actions/upload-artifact@v7
        with:
          name: werewolf-dm-wheel
          path: backend/dist/*.whl
          if-no-files-found: error
