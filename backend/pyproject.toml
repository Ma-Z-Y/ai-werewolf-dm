[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "werewolf-dm"
version = "0.1.0"
description = "AI-assisted werewolf game master for local six-player games"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [
  { name = "MaZY", email = "Mzy08185919@outlook.com" },
]
keywords = ["werewolf", "game-master", "fastapi", "websocket"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: FastAPI",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = [
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.7,<3",
  "uvicorn[standard]>=0.35,<1",
  "websockets>=15,<17",
]

[project.urls]
Homepage = "https://github.com/Ma-Z-Y/ai-werewolf-dm"
Repository = "https://github.com/Ma-Z-Y/ai-werewolf-dm"
Issues = "https://github.com/Ma-Z-Y/ai-werewolf-dm/issues"

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9",
  "pytest-asyncio>=1,<2",
  "ruff>=0.6,<1",
  "mypy>=1.11,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "latency: realtime latency measurements",
]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
